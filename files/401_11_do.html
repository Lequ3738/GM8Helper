<!--START-->
<h3 class="style1">Do 语句</h3>
<span class="style1">do 语句有如下格式 </span>
<p class="style1">
</p>
<blockquote class="style1">
  <pre><b>do</b> &lt;语句&gt; <b>until</b>(&lt;表达式&gt;)</pre>
语句（当然也可以用大括号包裹一长段程序）会一直重复执行，直到表达式为真（true）。 
语句至少会被执行一次。小心你的 do 循环。你可能会不小心弄出无限循环来，后果同 while 语句。 </blockquote>

<p class="style1"><b>示例 </b><br>
以下一段程序会将当前对象移动到一个随机的位置（效果同移动一个对象到一个随机 位置的动作）： </p>
<p>
</p>
<blockquote>
  <pre>{<br>  <b>do</b>
  {
    x = random(room_width);
    y = random(room_height);
  }
  <b>until</b> (place_free(x,y))<br>}<br></pre>

</blockquote>



<!--END-->
<!-- KEYWORDS
do statement
until
-->
