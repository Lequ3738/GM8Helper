<h1 class="style1">游戏绘制</h1>
<span class="style1">游戏的一个重要组成部分是画面。Game Maker 
基本上对此考虑了很多，对于简单点的游戏 用户不用考虑很多。但对于那些希望有更多控制能力的人来说还远远不够。很多时候你都可 
以使用代码写成的动作来控制游戏的各个方面。这一章就是为你详细叙述所有在游戏画面上 可以使用的变量和函数相关信息。</span>
