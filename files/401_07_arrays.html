<h3 class="style1">数组 </h3>
<span class="style1">你可以在GML中使用一维或二维数组。只需要使用方括号将数组索引号括起来即可，二维数 
组则在两个索引号之间加上逗号分隔。一旦你使用数组索引号，数组即被创建。每个数组 都从0开始编号。所以在建立超长的数组时要小心，因为内存占用会比较巨大。不要使用负 
数索引号。系统最大支持到32000的索引，以及总共1000000个最大索引尺寸。举个例子先</span>:

<p>
</p>
<blockquote>
  <pre>{<br>  a[0] = 1;<br>  i = 1;<br>  <b>while</b> (i &lt; 10) { a[i] = 2*a[i-1]; i += 1;}<br>  b[4,6] = 32;<br>}<br></pre>

</blockquote>
