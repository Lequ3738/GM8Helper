<!--START-->
<h3 class="style1">字体 </h3>
<span class="style1">下列函数介绍字体 : </span>
<p class="style1">
</p>
<blockquote class="style1"><tt><b>font_exists(ind)</b></tt> 返回值为指定索引号的字体是否存在。 
  <br>
  <tt><b>font_get_name(ind)</b></tt> 返回值为指定索引号的字体名字。 
  <br>
  <tt><b>font_get_fontname(ind)</b></tt> 返回值为指定索引号的字体的字形。 
  <br>
  <tt><b>font_get_bold(ind)</b></tt> 返回值为指定索引号的字体是否为粗体。 
  <br>
  <tt><b>font_get_italic(ind)</b></tt> 返回值为指定索引号的字体是否为斜体。 
  <br>
  <tt><b>font_get_first(ind)</b></tt> 返回值为指定索引号的字体中的第一个字符的索引号。 
  <br>
  <tt><b>font_get_last(ind) </b></tt>返回值为指定索引号的字体中的最后一个字符的索引号。</blockquote>
<p>

<!--END-->
