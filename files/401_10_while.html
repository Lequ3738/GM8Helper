<!--START-->
<h3 class="style1">While 语句</h3>
<span class="style1">while 语句有如下格式 </span>
<p class="style1">
</p>
<blockquote class="style1">
  <pre><b>while</b> (&lt;表达式&gt;) &lt;语句&gt; <br></pre>
</blockquote>

<p class="style1">只要表达式的值为真（true），语句就会一直运行下去。要注意你的 while 循环。你很容 
易会导致无限循环发生，那样的话你的游戏会永久挂起并失去任何用户输入的响应。 
</p>
<p><b>示例 </b><br>
以下一段程序会将对象置于随机的位置(这和把对象移动至随机位置的动作效果是一 样的).

</p>
<p>
</p>
<blockquote>
  <pre>{<br>  <b>while</b> (!place_free(x,y))<br>  {<br>    x = random(room_width);<br>    y = random(room_height);<br>  }<br>}<br></pre>

</blockquote>



<!--END-->
<!-- KEYWORDS
while statement
loop
