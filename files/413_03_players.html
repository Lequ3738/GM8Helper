<h3 class="style1">玩家</h3>
<span class="style1">在游戏中的每个图例凡是参与一个联机就是玩家。如同上面指出的，玩家有名字，有三 种例行程序与玩家有关 </span>
<p class="style1">
</p>
<blockquote class="style1"><tt><b>mplay_player_find()</b></tt> 
在目前联机中搜寻全部玩家并返回发现的玩家数目。 <br>
  <tt><b>mplay_player_name(numb)</b></tt> 
返回第numb号的玩家名称(0是第一位玩家，通常是你自己)。 这例行程序只能在呼叫之前的例行程序后呼叫。 
  <br>
  <tt><b>mplay_player_id(numb)</b></tt> 返回玩家号码是numb的唯一账号(0是第一个玩家，通常是你自 
己)。这例行程序只能在呼叫第一个例行程序后呼叫，这账号是使用于发送和接收不同的游 戏者讯息。</blockquote>
<!--END-->
