<h3>背景</h3>

下列函数介绍背景 : 
<p>
<blockquote>
  <tt><b>background_exists(ind)</b></tt>
	  返回值为指定索引号的背景是否存在。<br>
  <tt><b>background_get_name(ind)</b></tt>
	  返回值为指定索引号的背景名字。 <br>
  <tt><b>background_get_width(ind)</b></tt>
	  返回值为指定索引号的背景的宽度。 <br>
  <tt><b>background_get_height(ind)</b></tt>
	  返回值为指定索引号的背景的高度。<br>
</blockquote>

在某些情况下，你可能要保存相应的背景位图到文件中。对于此有以下函数可用：
<p>
<blockquote>
  <tt><b>background_save(ind,fname)</b></tt> 
    保存背景ind到文件名为fname的文件，这一定是一个png类型的文件。<b><i>仅在注册版可用。</i></b><br>
</blockquote>
