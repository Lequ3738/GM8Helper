<h1>全局游戏设置</h1>

你可以在这里对你的游戏进行许多操作，比如改变主窗口的形状，设置一些图形选项，处理交互设置，加载图像，声明常亮和更改作者信息。还可以在这里显示哪些文件应该包含在独立游戏中，以及如何处理错误。<p>
在屏幕左边的资源树中，通过双击<b>全局游戏设置</b>，来改变设置（有些选项仅在高级模式下可用。） <!--HELPONLY-->
