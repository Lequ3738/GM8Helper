<h1 class="style1">用户互动 </h1>
<span class="style1">不存在不和玩家发生互动的游戏。在Game 
Maker中进行互动，标准的途径是使用键盘或鼠标 动作。但有些时候你需要更多的控制。使用一些代码你就可以检查某些键盘按键是否被按下 
，当前鼠标的位置以及鼠标哪个键被按下等等功能。通常你会在某些手柄对象的步幅事件中 使用到他们，并做出相应的动作。</span><!--HELPONLY-->
