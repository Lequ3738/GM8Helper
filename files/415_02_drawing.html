<h3>简单绘制</h3>
一旦3D模式被打开你能在GameMaker中使用它(除了在开始时).只有物体将显示不同尺寸基于他们的深度设定.你能使用视角.一个有用的函数.如果你绘制一些东西在一段代码中你可能想改变深度值在你的原始绘制中,你能使用.:

<p>
</p>
<blockquote>
  <tt><b>d3d_set_depth(depth)</b></tt> 设置绘制深度.<br>

</blockquote>


<p>注意:某些时候一个新的对象被绘制的深度是另外设定这个对象的深度. 

<!--END-->
