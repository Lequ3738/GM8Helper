<h3 class="style1">赋值语句 </h3>
<span class="style1">一段赋值语句将一个值放入一个变量。形式如下 : </span>
<p class="style1">
</p>
<blockquote class="style1">
  <pre>&lt;变量名&gt; = &lt;表达式&gt;;</pre>
</blockquote>

<p>一个表达式可以是一个简单的数值，也可以是复杂的运算式。除了向一个变量赋值以外，同 样可以在当前变量值的基础上再次赋值，使用 
'+='的格式。当然，还有 -=,*= /= 或者更 加复杂的格式如 |=、&amp;\、^=.

<!--END-->
