<body background="images/back.gif">

<!--START-->
<h3 class="style1">Repeat 语句</h3>
<span class="style1">一个 repeat 语句有如下格式 </span>
<p class="style1">
</p>
<blockquote class="style1">
  <pre><b>repeat</b> (&lt;表达式&gt;) &lt;语句&gt; <br></pre>
</blockquote>

<p class="style1">这样语句会重复运行与括号内表达式的值相同的次数 。 
</p>
<p><b>示例</b><br>
以下一段程序会在随机位置创建5个皮球.

</p>
<p>
</p>
<blockquote>
  <pre>{<br>  <b>repeat</b> (5) instance_create(random(400),random(400),ball);<br>}<br></pre>

</blockquote>



<!--END-->
<!-- KEYWORDS
repeat statement
-->
</body>
</html>
