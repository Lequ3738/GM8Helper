<h1>共发指令</h1>

<p>如果你<strong>只对 RGB 通道</strong>进行操作，你可以同时执行<strong>另一条 Alpha 通道的指令</strong>，
这样两条指令<strong>只会被计算为一条</strong>（称为共发指令），从而提高性能。</p>
<p><strong>示例（使用 <code>+</code> 表示共发指令）：</strong></p>
<pre>
ps.1.4

texld  r0,     t0
texld  r1,     t0
mov    r0.rgb, r1
+mov   r1.a,   r0
</pre>
