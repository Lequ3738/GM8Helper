<h1>使用Game Maker</h1>

<I>Game Maker</I>是一个使用起来很简单的软件，用来制作属于你自己的电脑游戏。本章节给了你制作第一个游戏所需的帮助信息。后面的章节将讨论更牛逼的主题, 
比如如何优化和发布你的游戏，如何使用内置的编程语言gml来编写游戏之类的这大大拓展了游戏的可能性 <!--HELPONLY-->
